# Include inside the ketrinmaxim.ru server { } block on VPS, replacing its own
# `root`, `index` and `location /` lines:
#   include /etc/nginx/snippets/photo-portfolio.conf;
#
# Layout: the git checkout itself is the site.
#   dist/   — index.html + hashed JS/CSS (vite build, copyPublicDir: false)
#   public/ — photos (JPG sources + webp variants), served as-is

root /var/www/photo-portfolio/dist;
index index.html;

# Code from dist/, otherwise a file from public/, otherwise the SPA shell.
location / {
    try_files $uri @public;
}

location @public {
    root /var/www/photo-portfolio/public;
    try_files $uri /index.html;
}

# index.html must never be cached — it points to the current hashed assets.
location = /index.html {
    add_header Cache-Control "no-cache";
}

# Photos and other static files: public/ first, then dist/ (hashed assets).
location ~* \.(?:webp|jpe?g|png|svg|ico|woff2?)$ {
    root /var/www/photo-portfolio/public;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri @dist_static;
}

location @dist_static {
    root /var/www/photo-portfolio/dist;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    access_log off;
    try_files $uri =404;
}
